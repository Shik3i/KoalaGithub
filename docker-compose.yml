services:
  koala-github:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: koala-github
    ports:
      - '8088:8080'
    volumes:
      - koala_data:/data
    environment:
      PORT: '8080'
      DB_PATH: /data/koalagithub.db
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  koala_data:
