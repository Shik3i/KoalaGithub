name: CI Quality & Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check TypeScript Types
        run: npm run check

      - name: Run Vitest Registry Tests
        run: npm test

      - name: Build Static Site (www/)
        run: npm run build

      - name: Run Go Server Unit Tests
        run: go test ./internal/... .

      - name: Compile Go Server Binary
        run: CGO_ENABLED=0 go build -o koala-github ./main.go
